<div class="console">
  <div class="console-header">
    <span class="status-dot" aria-hidden="true"></span>
    <span class="title">NEXUS / Seguridad · nivel 3</span>
  </div>

  <form (ngSubmit)="cambiarPassword()" class="console-body" [attr.aria-busy]="cargando">
    <div class="field">
      <label for="clave-actual">Contraseña actual</label>
      <input
        id="clave-actual"
        type="password"
        [(ngModel)]="passwordActual"
        name="passwordActual"
        autocomplete="current-password"
        required
      />
    </div>

    <div class="field">
      <label for="clave-nueva">Nueva contraseña</label>
      <input
        id="clave-nueva"
        type="password"
        [(ngModel)]="passwordNueva"
        name="passwordNueva"
        autocomplete="new-password"
        required
      />
    </div>

    <div class="field">
      <label for="clave-confirmacion">Confirmar contraseña</label>
      <input
        id="clave-confirmacion"
        type="password"
        [(ngModel)]="passwordConfirmacion"
        name="passwordConfirmacion"
        autocomplete="new-password"
        required
      />
    </div>

    <div class="messages" aria-live="polite">
      <p class="error" *ngIf="error" role="alert">! {{ error }}</p>
      <p class="success" *ngIf="exito" role="status">OK {{ exito }}</p>
    </div>

    <button type="submit" [disabled]="cargando">
      {{ cargando ? 'Procesando…' : 'Ejecutar cambio' }}
    </button>
  </form>
</div>
